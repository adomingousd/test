<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#003B70">
<title>My App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #003B70;
    --orange: #C4521B;
    --link: #1072C6;
    --page: #F7F7F7;
    --white: #FFFFFF;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: var(--navy);
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.22);
    position: relative;
    z-index: 2;
  }
  .nav {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 12px 6px 18px;
    color: var(--white);
  }
  .nav .back { width: 22px; height: 22px; margin-right: 26px; flex: none; }
  .nav .idicon { width: 18px; height: 14px; margin-right: 13px; flex: none; }
  .nav h1 {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.2px;
    flex: 1;
  }
  .nav .bookmark { width: 17px; height: 21px; flex: none; margin-right: 4px; }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px 18px 0;
  }

  /* Universal Image Container Style */
  .img-container {
    background: var(--white);
    border: 1px solid #E6E6E6;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Top Banner Panel */
  .top-panel {
    height: 86px;
  }

  /* Main Display Card */
  .card {
    margin-top: 18px;
    position: relative;
    aspect-ratio: 1078 / 679;
    border: none;
  }

  /* Date row */
  .date-row {
    margin-top: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .cal {
    width: 51px; height: 51px;
    background: var(--white);
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 0.5px 1px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    flex: none;
  }
  .cal .top { background: var(--orange); height: 14px; border-radius: 5px 5px 0 0; }
  .cal .body {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; line-height: 1.1; color: #111;
  }
  .clock {
    color: var(--orange);
    font-size: clamp(17px, 5.4vw, 22px);
    font-weight: 700;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .spacer { flex: 1; }
  .balance {
    display: flex; align-items: center; justify-content: center;
    gap: 16px;
    color: var(--link);
    font-size: 15px;
    padding-bottom: 72px;
  }
  .balance svg { width: 13px; height: 8px; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="nav">
      <svg class="back" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2 L6 11 L15 20"/></svg>
      <svg class="idicon" viewBox="0 0 18 14"><rect x="0.5" y="0.5" width="17" height="13" rx="2" fill="#fff"/><circle cx="5.3" cy="5.4" r="1.9" fill="#003B70"/><path d="M2.4 10.8c.4-1.9 1.6-2.8 2.9-2.8s2.5.9 2.9 2.8z" fill="#003B70"/><rect x="9.6" y="3.8" width="6" height="1.3" fill="#003B70"/><rect x="9.6" y="6.4" width="6" height="1.3" fill="#003B70"/><rect x="9.6" y="9" width="4.2" height="1.3" fill="#003B70"/></svg>
      <h1>My ID Card</h1>
      <svg class="bookmark" viewBox="0 0 17 21" fill="none" stroke="#F2B01E" stroke-width="2.2" stroke-linejoin="round"><path d="M1.5 1.5h14v18l-7-5.2-7 5.2z"/></svg>
    </div>
  </header>

  <main class="content">
    <!-- Top Image Panel (Replaces Barcode) -->
    <div class="img-container top-panel">
      <img src="code.jpg" alt="Top Banner">
    </div>

    <!-- Main Image Card (Replaces ID Card) -->
    <div class="img-container card">
      <img src="card.jpg" alt="Main Content">
    </div>

    <div class="date-row">
      <div class="cal">
        <div class="top"></div>
        <div class="body"><span id="mon">Sept</span><span id="day">25</span></div>
      </div>
      <div class="clock" id="clock">Friday, 07:24:52 PM</div>
    </div>

    <div class="spacer"></div>

    <div class="balance">
      <svg viewBox="0 0 13 8" fill="none" stroke="#1072C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7 L6.5 1.5 L12 7"/></svg>
      <span>More Info</span>
    </div>
  </main>
</div>

<script>
  // Live clock
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    var h = d.getHours(), ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('clock').textContent =
      DAYS[d.getDay()] + ', ' + pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + ampm;
    document.getElementById('mon').textContent = MONTHS[d.getMonth()];
    document.getElementById('day').textContent = d.getDate();
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
